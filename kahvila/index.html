<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma kahvila</title>
</head>
<body>
    <header id="header">
        <h1>Oma kahvila: Hygge</h1>
    </header>

    <div class="container">
        <section class="osio">
            <h2>Tietoa kahvilasta</h2>
            <p>Hygge on pieni kahvila, jonka ideana on skandinaavinen kodikkuus.
                Meiltä saa kahvia, teetä, korvapuusteja ja kevyitä lounaita.
                Täällä voit rauhassa lukea kirjaa, jutella tai vain nauttia lempijuomastasi.</p>
            <div class="kuva-ryhma">
                <img src="kuvat/interior.webp" alt="Kahvilan valoisa sisätila, jossa on sohva, tyynyjä ja pieniä pöytiä">
                <img src="kuvat/cup.JPG" alt="Valkoinen kuppi mustaa kahvia lautasella">
                <img src="kuvat/korvapuusti.webp" alt="Korvapuusti, jonka päällä on raesokeria">
            </div>
        </section>
    </div>
</body>
</html>
